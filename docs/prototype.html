<title>RNA-seq Service — Request Builder</title>

<style>
  /* ---------- tokens ---------- */
  :root{
    --bg:#f5f7f9; --panel:#ffffff; --panel-2:#fafbfc; --sunk:#f1f4f7;
    --ink:#0f172a; --ink-2:#4a5769; --ink-3:#8b98ab;
    --line:#e3e8ee; --line-2:#cdd6e0;
    --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0ff; --accent-line:#c7c9f7;
    --A:#15803d; --C:#1d4ed8; --G:#b45309; --T:#b91c1c;
    --A-bg:#e7f6ec; --C-bg:#e8effd; --G-bg:#fdf1e0; --T-bg:#fdeaea;
    --ok:#15803d; --ok-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fdf1e0; --crit:#b91c1c; --crit-bg:#fdeaea;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.18);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#080d18; --panel:#111a2b; --panel-2:#0d1524; --sunk:#0b1220;
      --ink:#e8eef8; --ink-2:#a3b2c9; --ink-3:#6b7c95;
      --line:#1f2b40; --line-2:#31415c;
      --accent:#8b93ff; --accent-ink:#0a1020; --accent-soft:#1b1f45; --accent-line:#3b3f7a;
      --A:#5cd68a; --C:#7aa7ff; --G:#f0b447; --T:#ff8a8a;
      --A-bg:#0f2a1b; --C-bg:#111f3d; --G-bg:#2c2110; --T-bg:#2e1517;
      --ok:#5cd68a; --ok-bg:#0f2a1b; --warn:#f0b447; --warn-bg:#2c2110; --crit:#ff8a8a; --crit-bg:#2e1517;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#080d18; --panel:#111a2b; --panel-2:#0d1524; --sunk:#0b1220;
    --ink:#e8eef8; --ink-2:#a3b2c9; --ink-3:#6b7c95;
    --line:#1f2b40; --line-2:#31415c;
    --accent:#8b93ff; --accent-ink:#0a1020; --accent-soft:#1b1f45; --accent-line:#3b3f7a;
    --A:#5cd68a; --C:#7aa7ff; --G:#f0b447; --T:#ff8a8a;
    --A-bg:#0f2a1b; --C-bg:#111f3d; --G-bg:#2c2110; --T-bg:#2e1517;
    --ok:#5cd68a; --ok-bg:#0f2a1b; --warn:#f0b447; --warn-bg:#2c2110; --crit:#ff8a8a; --crit-bg:#2e1517;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
  :root[data-theme="light"]{
    --bg:#f5f7f9; --panel:#ffffff; --panel-2:#fafbfc; --sunk:#f1f4f7;
    --ink:#0f172a; --ink-2:#4a5769; --ink-3:#8b98ab;
    --line:#e3e8ee; --line-2:#cdd6e0;
    --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0ff; --accent-line:#c7c9f7;
    --A:#15803d; --C:#1d4ed8; --G:#b45309; --T:#b91c1c;
    --A-bg:#e7f6ec; --C-bg:#e8effd; --G-bg:#fdf1e0; --T-bg:#fdeaea;
    --ok:#15803d; --ok-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fdf1e0; --crit:#b91c1c; --crit-bg:#fdeaea;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.18);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
  p{margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .top-in{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.02em}
  .helix{width:26px;height:26px;flex:none}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);
               letter-spacing:.09em;text-transform:uppercase;font-family:var(--mono)}
  .top-spacer{flex:1}
  .ghost{background:none;border:1px solid var(--line-2);color:var(--ink-2);padding:6px 12px;
         border-radius:7px;cursor:pointer;font-size:13px}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}

  .shell{display:grid;grid-template-columns:236px 1fr;gap:32px;padding:28px 0 96px}
  @media (max-width:880px){ .shell{grid-template-columns:1fr;gap:18px} }

  /* ---------- step rail ---------- */
  .rail{position:sticky;top:88px;align-self:start;display:flex;flex-direction:column;gap:2px}
  @media (max-width:880px){ .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px} }
  .rail-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--ink-3);padding:0 8px 10px}
  @media (max-width:880px){ .rail-h{display:none} }
  .stepbtn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:1px solid transparent;
           background:none;cursor:pointer;text-align:left;width:100%;white-space:nowrap}
  .stepbtn:hover:not(:disabled){background:var(--panel)}
  .stepbtn:disabled{cursor:not-allowed;opacity:.45}
  .stepbtn.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
  .base{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;
        font-family:var(--mono);font-weight:700;font-size:13px;line-height:1}
  .b-A{background:var(--A-bg);color:var(--A)} .b-C{background:var(--C-bg);color:var(--C)}
  .b-G{background:var(--G-bg);color:var(--G)} .b-T{background:var(--T-bg);color:var(--T)}
  .stepbtn .lb{font-size:13.5px;font-weight:550;line-height:1.25}
  .stepbtn .sb{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .stepbtn.done .sb{color:var(--ok)}

  /* ---------- panel ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
         padding:26px 26px 24px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .h-step{font-size:23px;font-weight:640;margin-top:5px}
  .lede{color:var(--ink-2);margin-top:7px;max-width:62ch;font-size:14.5px}
  .sec{margin-top:26px}
  .sec-h{font-size:14px;font-weight:620;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sec-sub{color:var(--ink-3);font-size:13px;margin-bottom:12px;max-width:66ch}
  .req{color:var(--crit);font-family:var(--mono);font-size:12px}

  /* ---------- dropzone ---------- */
  .drop{border:1.5px dashed var(--line-2);border-radius:13px;background:var(--panel-2);
        padding:38px 24px;text-align:center;transition:border-color .15s,background .15s}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft)}
  .drop h3{font-size:16.5px;font-weight:600}
  .drop p{color:var(--ink-2);font-size:13.5px;margin-top:6px}
  .drop .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;padding:9px 17px;
       border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn-2{background:var(--panel);color:var(--ink);border:1px solid var(--line-2)}
  .btn-2:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .hint{font-size:12px;color:var(--ink-3);margin-top:14px;font-family:var(--mono)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:18px 0 6px}
  .stat{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-size:20px;font-weight:640;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em}
  .stat .v small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}

  /* ---------- tables ---------- */
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:660px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
     text-align:left;padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap;
     position:sticky;top:0}
  td{padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .files-cell{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .files-cell b{color:var(--ink-2);font-weight:600}

  input[type=text],input[type=email],select,textarea{
    background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:13.5px;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:78px;line-height:1.5}
  .in-mono{font-family:var(--mono)}
  .inline-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .inline-in input{width:auto;flex:1;min-width:130px}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
        font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em}
  .p-pe{background:var(--C-bg);color:var(--C)} .p-se{background:var(--G-bg);color:var(--G)}
  .p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}

  /* ---------- MCQ cards ---------- */
  .mcq{display:grid;gap:9px}
  .mcq.two{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
  .opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);
       border-radius:10px;cursor:pointer;background:var(--panel);transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--accent-line);background:var(--panel-2)}
  .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
  .opt input{margin:2px 0 0;accent-color:var(--accent);flex:none;width:16px;height:16px}
  .opt .ot{font-size:14px;font-weight:560;line-height:1.35}
  .opt .od{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
  .opt .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--sunk);
            color:var(--ink-3);margin-left:6px;letter-spacing:.04em;white-space:nowrap}
  .opt .tag.rec{background:var(--ok-bg);color:var(--ok)}
  .opt .tag.det{background:var(--C-bg);color:var(--C)}
  .opt .tag.asm{background:var(--warn-bg);color:var(--warn)}

  /* auto-fill provenance */
  .why{font-size:12px;color:var(--ink-3);margin:-4px 0 11px;line-height:1.45}
  .why span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
            color:var(--ink-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;margin-right:6px}
  .autobar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:18px;padding:11px 13px;
           border:1px solid var(--line-2);border-left:2.5px solid var(--G);border-radius:0 10px 10px 0;
           background:var(--panel-2);font-size:13px;color:var(--ink-2)}
  .autobar b{color:var(--ink)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .field label{display:block;font-size:12.5px;font-weight:560;margin-bottom:5px}
  .field .fh{font-size:11.5px;color:var(--ink-3);margin-top:4px}

  .note{border-left:2.5px solid var(--accent);background:var(--accent-soft);padding:10px 13px;border-radius:0 8px 8px 0;
        font-size:13px;color:var(--ink-2);margin-top:12px}
  .warnbox{border-left:2.5px solid var(--warn);background:var(--warn-bg);padding:10px 13px;border-radius:0 8px 8px 0;
        font-size:13px;color:var(--ink-2);margin-top:12px}

  /* ---------- review ---------- */
  .spec{border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .spec-r{display:grid;grid-template-columns:186px 1fr;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
  .spec-r:last-child{border-bottom:none}
  .spec-r:nth-child(odd){background:var(--panel-2)}
  .spec-r .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;padding-top:2px}
  .spec-r .v{font-weight:520}
  @media (max-width:600px){ .spec-r{grid-template-columns:1fr;gap:2px} }

  /* ---------- footer bar ---------- */
  .bar{position:sticky;bottom:0;background:color-mix(in srgb,var(--panel) 92%,transparent);
       backdrop-filter:blur(9px);border-top:1px solid var(--line);margin-top:26px;
       padding:13px 0;display:flex;align-items:center;gap:14px;z-index:15}
  .bar .msg{font-size:12.5px;color:var(--ink-3);flex:1}
  .bar .msg.block{color:var(--warn)}
  .prog{display:flex;gap:4px;align-items:center}
  .prog i{width:22px;height:4px;border-radius:2px;background:var(--line-2);display:block}
  .prog i.on{background:var(--accent)}

  .empty{text-align:center;padding:34px 20px;color:var(--ink-3);font-size:13.5px}
  .rowacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
  .chip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);
        background:var(--panel);cursor:pointer;color:var(--ink-2)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .xbtn{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:5px}
  .xbtn:hover{color:var(--crit);background:var(--crit-bg)}
  code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
  pre{font-family:var(--mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);
      border-radius:10px;padding:14px;overflow-x:auto;line-height:1.5;margin:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg class="helix" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round">
        <path d="M7 2c0 5 10 5 10 10S7 17 7 22" stroke="var(--C)"/>
        <path d="M17 2c0 5-10 5-10 10s10 5 10 10" stroke="var(--T)"/>
        <path d="M8.4 6h7.2M8.4 18h7.2M7.2 9.6h9.6M7.2 14.4h9.6" stroke="var(--ink-3)" stroke-width="1.1"/>
      </svg>
      <div>RNA-seq Service<small>Request builder</small></div>
    </div>
    <div class="top-spacer"></div>
    <span class="hint" style="margin:0" id="privacy">Files are read in your browser only</span>
    <button class="ghost" id="themeBtn" type="button">Theme</button>
  </div>
</header>

<div class="wrap shell">
  <nav class="rail" id="rail">
    <div class="rail-h">Request · 4 steps</div>
  </nav>

  <main>
    <section class="panel" id="panel"></section>
    <div class="bar">
      <button class="ghost" id="backBtn" type="button">← Back</button>
      <div class="prog" id="prog"></div>
      <div class="msg" id="msg"></div>
      <button class="btn" id="nextBtn" type="button">Continue →</button>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* =================== state =================== */
  const STEPS = [
    {base:"A", key:"files",   label:"Sequencing files", sub:"scan"},
    {base:"C", key:"samples", label:"Name samples",     sub:"label"},
    {base:"G", key:"design",  label:"Design & analysis",sub:"answer"},
    {base:"T", key:"request", label:"Review & send",    sub:"submit"},
  ];

  const S = {
    step: 0,
    scanned: false,
    files: [],        // {name, path, size}
    other: [],        // non-fastq files seen
    pairing: "auto",
    samples: [],      // {id, name, condition, files:[{name,path,size,read,lane}]}
    groups: ["Control", "Treated"],
    q: {
      organism:"", organismOther:"",
      library:"", strand:"", layout:"",
      genome:"", genomeOther:"",
      control:"", paired:"",
      deliver:new Set(["deg","enrich","bundle","qc"]),
      question:"",
    },
    c: { name:"", email:"", org:"", project:"", turnaround:"", notes:"", agree:false },
    touched: new Set(),   // answers the user set by hand — inference never overwrites these
    inferred: {},         // key -> {value, why, kind:"detected"|"assumed"}
  };

  const $  = (s,r=document) => r.querySelector(s);
  const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const fmtSize = b => b >= 1e9 ? (b/1e9).toFixed(1)+" GB" : b >= 1e6 ? (b/1e6).toFixed(0)+" MB" : (b/1e3).toFixed(0)+" KB";

  /* =================== FASTQ detection =================== */
  const FASTQ_RX = /\.(fastq|fq)(\.gz|\.bz2)?$/i;

  // Illumina + SRA/BGI conventions. Returns the sample stem, read number, lane.
  function parseFastq(name){
    const base = name.replace(FASTQ_RX, "");
    let m;
    if ((m = base.match(/^(.*?)_S\d+(?:_L(\d{3}))?_R([12])(?:_\d{3})?$/i)))
      return {stem:m[1], lane:m[2]||null, read:+m[3]};
    if ((m = base.match(/^(.*?)(?:_L(\d{3}))?_R([12])(?:_\d{3})?$/i)))
      return {stem:m[1], lane:m[2]||null, read:+m[3]};
    if ((m = base.match(/^(.*?)(?:_L(\d{3}))?[._]([12])$/)))
      return {stem:m[1], lane:m[2]||null, read:+m[3]};
    return {stem:base, lane:null, read:null};
  }

  function buildSamples(){
    const prev = new Map(S.samples.map(s => [s.id, s]));
    const by = new Map();
    for (const f of S.files){
      const p = parseFastq(f.name);
      const id = S.pairing === "one" ? f.name : (p.stem || f.name);
      if (!by.has(id)) by.set(id, []);
      by.get(id).push({...f, read:S.pairing==="one" ? null : p.read, lane:p.lane});
    }
    S.samples = [...by.entries()]
      .sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}))
      .map(([id, files]) => {
        files.sort((a,b) => (a.read||0)-(b.read||0) || a.name.localeCompare(b.name));
        const old = prev.get(id);
        return { id, name: old?.name ?? id, condition: old?.condition ?? "", files };
      });
  }

  const layoutOf = s => s.files.some(f => f.read === 2) ? "paired" : "single";
  const detectedLayout = () => S.samples.length && S.samples.every(s => layoutOf(s)==="paired") ? "paired"
                             : S.samples.some(s => layoutOf(s)==="paired") ? "mixed" : "single";
  const totalBytes = () => S.files.reduce((a,f) => a+f.size, 0);
  const usedGroups = () => [...new Set(S.samples.map(s=>s.condition).filter(Boolean))];

  /* =================== file intake =================== */
  async function readAllEntries(reader){
    const out = [];
    for(;;){
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) return out;
      out.push(...batch);
    }
  }
  async function walkEntry(entry, prefix, sink){
    if (entry.isFile){
      const f = await new Promise((res, rej) => entry.file(res, rej));
      sink.push({name:entry.name, path:prefix+entry.name, size:f.size});
    } else if (entry.isDirectory){
      const kids = await readAllEntries(entry.createReader());
      for (const k of kids) await walkEntry(k, prefix+entry.name+"/", sink);
    }
  }
  async function fromDataTransfer(dt){
    const sink = [];
    const entries = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    if (entries.length){ for (const e of entries) await walkEntry(e, "", sink); }
    else for (const f of dt.files) sink.push({name:f.name, path:f.webkitRelativePath||f.name, size:f.size});
    return sink;
  }

  function ingest(list){
    const seen = new Set(S.files.map(f=>f.path));
    const other = [];
    for (const f of list){
      if (FASTQ_RX.test(f.name)){ if (!seen.has(f.path)){ seen.add(f.path); S.files.push(f); } }
      else other.push(f.name);
    }
    S.other = other;
    S.files.sort((a,b) => a.path.localeCompare(b.path, undefined, {numeric:true}));
    S.scanned = true;
    resetInference();   // a changed file corpus invalidates every earlier guess
    buildSamples();
    render();
  }

  /* =================== render: step A =================== */

  /* =================== render: step C =================== */
  function stepSamples(p){
    p.append(head("Step C · Name samples", "Tell us what each file actually is",
      "File names from the sequencer are rarely meaningful. Give every sample the name you want to see in your results, then assign it to a group."));

    const g = el("div","sec");

    const gi = el("div","inline-in");
    const inp = el("input"); inp.type="text"; inp.className="in-mono";
    inp.value = S.groups.join(", ");
    inp.placeholder = "Control, Treated";

    const gh = el("p","fh"); gh.style.marginTop="6px";

    s.append(secH("2 · Name each sample", "Edit any name. Bulk edits below apply to every row at once."));

    const acts = el("div","rowacts");
    const bFolder = el("button","chip","Name from parent folder");
    bFolder.onclick = () => { S.samples.forEach(x => {
      const parts = x.files[0].path.split("/"); if (parts.length>1) x.name = parts[parts.length-2];
    }); render(); };
    const bStem = el("button","chip","Reset to file stem");
    bStem.onclick = () => { S.samples.forEach(x => x.name = x.id); render(); };
    acts.append(bFolder, bStem);

    const find = el("input"); find.type="text"; find.placeholder="find"; find.style.width="112px"; find.className="in-mono";
    const repl = el("input"); repl.type="text"; repl.placeholder="replace"; repl.style.width="112px"; repl.className="in-mono";
    const go = el("button","chip","Replace in all names");
    go.onclick = () => { if (!find.value) return;
      S.samples.forEach(x => x.name = x.name.split(find.value).join(repl.value)); render(); };
    acts.append(find, repl, go);
    s.append(acts);

    const tw = el("div","tblwrap");
    const tbl = el("table");
    tbl.innerHTML = `<thead><tr>
      <th style="width:34px">#</th><th style="min-width:190px">Sample name</th>
      <th style="min-width:150px">Group</th><th>Files</th><th style="width:34px"></th></tr></thead>`;
    const tb = el("tbody");
    S.samples.forEach((smp, i) => {
      const tr = el("tr");
      const c0 = el("td","num"); c0.textContent = i+1;

      const c1 = el("td");
      const ni = el("input"); ni.type="text"; ni.value=smp.name; ni.className="in-mono";
      ni.oninput = () => { smp.name = ni.value; validate(); };

      c2.append(sl);

      const c3 = el("td","files-cell");
      c3.innerHTML = smp.files.map(f => `${f.read?`<b>R${f.read}</b> `:""}${esc(f.name)}`).join("<br>");

      const c4 = el("td");
      const x = el("button","xbtn","×"); x.title="Exclude this sample";
      x.onclick = () => { S.samples.splice(i,1); render(); };
      c4.append(x);

      tr.append(c0,c1,c2,c3,c4); tb.append(tr);
    });
    tbl.append(tb); tw.append(tbl); s.append(tw);

    const counts = usedGroups().map(gr => `${gr}: ${S.samples.filter(x=>x.condition===gr).length}`).join("  ·  ");
    const cn = el("p","hint"); cn.textContent = counts ? `Assigned — ${counts}` : "No groups assigned yet.";
    s.append(cn);
    p.append(s);

    const dup = new Set(), dups = new Set();
    S.samples.forEach(x => { if (dup.has(x.name)) dups.add(x.name); dup.add(x.name); });
    if (dups.size){
      const w = el("div","warnbox");
      w.innerHTML = `<b>Duplicate sample names:</b> <code>${[...dups].map(esc).join("</code>, <code>")}</code>. Names must be unique.`;
      p.append(w);

  function fillGroupSelect(sl, cur){
    sl.innerHTML = "";
    const blank = el("option",null,"— choose —"); blank.value=""; sl.append(blank);
    S.groups.forEach(gr => { const o=el("option",null,gr); o.value=gr; sl.append(o); });
    sl.value = S.groups.includes(cur) ? cur : "";
  }
  function refreshGroupSelects(){
    document.querySelectorAll("select[data-grp]").forEach(sl => {
      const smp = S.samples[+sl.dataset.idx];
      fillGroupSelect(sl, smp.condition);
      if (sl.value !== smp.condition) smp.condition = sl.value;
    });
    validate();
  }

  /* =================== inference from the scan =================== */
  // Everything here is a guess from file *names* only — we never read file contents.
  // "detected" = a concrete token in the paths; "assumed" = a safe default to confirm.

  // Match a whole token, treating _ - . / as separators (so "rat" won't hit "generated").
  function findTok(hay, words){
    const m = hay.match(new RegExp(`(?:^|[^a-z0-9])(${words})(?:[^a-z0-9]|$)`, "i"));
    return m ? m[1] : null;
  }
  const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  const ORGANISMS = [
    ["human", "human|homo[^a-z0-9]?sapiens|hsapiens|grch3[78]|hg19|hg38"],
    ["mouse", "mouse|mice|mus[^a-z0-9]?musculus|grcm3[89]|mm9|mm10|mm39"],
    ["rat",   "rat|rats|rattus|rnor[^a-z0-9]?\\d|rn[456]"],
  ];
  const BUILDS = [
    [/grch38|hg38/i,  "GRCh38", true ],
    [/grcm39|mm39/i,  "GRCm39", true ],
    [/grch37|hg19/i,  "GRCh37 / hg19", false],
    [/grcm38|mm10/i,  "GRCm38 / mm10", false],
  ];
  const LIBRARIES = [
    ["threeprime", "quantseq|brb[^a-z0-9]?seq|3[^a-z0-9]?end|three[^a-z0-9]?prime"],
    ["total",      "total[^a-z0-9]?rna|ribo[^a-z0-9]?zero|ribozero|ribominus|rrna[^a-z0-9]?depleted"],
    ["polya",      "poly[^a-z0-9]?a|polya|mrna|mrnaseq"],
  ];
  const STRANDS = [
    ["unstranded", "unstranded|non[^a-z0-9]?stranded"],
    ["reverse",    "dutp|reverse[^a-z0-9]?stranded|fr[^a-z0-9]?firststrand"],
    ["forward",    "forward[^a-z0-9]?stranded|fr[^a-z0-9]?secondstrand"],
  ];
  const CTRL_EXACT = /^(control|ctrl|ctl|wt|wildtype|wild[\W_]?type|untreated|untr|vehicle|veh|dmso|pbs|saline|mock|sham|naive|baseline|normal|healthy|parental|nc|neg|negative|scramble|scr|shscr|shnc|sinc|ev|empty|day\W?0|d0|t0|pre|uninfected|uninduced)$/i;
  // Substring matches only — "wt" is deliberately absent here because it hides inside
  // words like "growth"; it is caught as a whole group name by CTRL_EXACT instead.
  const CTRL_PART  = /control|ctrl|wild[\W_]?type|untreated|vehicle|dmso|mock|sham|naive|baseline|healthy|parental|scramble|negative|normal(?!i)/i;

  // Do the same subject IDs appear in every group? (WT_1/KO_1 style replicate numbers
  // are deliberately rejected — a bare number is a replicate index, not a subject.)
  function sharedSubjects(){
    const groups = usedGroups();
    if (groups.length < 2) return [];
    const byGroup = new Map(groups.map(g => [g, new Set()]));
    for (const s of S.samples){
      if (!s.condition) continue;
      const key = s.name.toLowerCase()
        .replace(new RegExp(rxEsc(s.condition.toLowerCase()), "g"), " ")
        .replace(/[^a-z0-9]+/g, " ").trim();
      if (key.length >= 2 && /[a-z]/.test(key)) byGroup.get(s.condition).add(key);
    }
    const [first, ...rest] = [...byGroup.values()];
    return [...first].filter(k => rest.every(r => r.has(k)));
  }

  function inferFromScan(){
    if (!S.files.length) return;
    const hay = S.files.map(f => f.path).join(" ") + " " + S.samples.map(s => s.name).join(" ");

    const set = (key, value, why, kind) => {
      if (S.touched.has(key) || !value) return;
      S.q[key] = value;
      S.inferred[key] = {value, why, kind: kind || "detected"};
    };

    // 4 · Read layout — the strongest signal we have: R1 + R2 files per sample.
    const lay = detectedLayout();
    if (lay !== "mixed")
      set("layout", lay, lay === "paired"
        ? "every sample has an R1 and an R2 file"
        : "one file per sample, no R2 found");

    // 1 · Organism — only if a species or genome token appears in the paths.
    for (const [v, words] of ORGANISMS){
      const hit = findTok(hay, words);
      if (hit){ set("organism", v, `“${hit}” in your file paths`); break; }
    }

    // 5 · Reference genome — a named build wins; otherwise assume the current standard.
    let build = null;
    for (const [rx, name, isLatest] of BUILDS){
      const m = hay.match(rx);
      if (m){ build = {m:m[0], name, isLatest}; break; }
    }
    if (build && build.isLatest) set("genome", "latest", `“${build.m}” in your file paths`);
    else if (build){
      set("genome", "specific", `“${build.m}” in your file paths`);
      if (!S.touched.has("genome") && !S.q.genomeOther) S.q.genomeOther = build.name;
    } else set("genome", "latest", "no build named in your files — this is our default", "assumed");

    // 2 · Library prep & 3 · strandedness — only when the provider spelled it out.
    for (const [v, words] of LIBRARIES){
      const hit = findTok(hay, words);
      if (hit){ set("library", v, `“${hit}” in your file paths`); break; }
    }
    for (const [v, words] of STRANDS){
      const hit = findTok(hay, words);
      if (hit){ set("strand", v, `“${hit}” in your file paths`); break; }
    }

    // 6 · Control group — from how the groups were named on the previous step.
    const groups = usedGroups();
    if (S.q.control && !groups.includes(S.q.control)){ S.q.control = ""; S.touched.delete("control"); }
    const ctrl = groups.find(g => CTRL_EXACT.test(g.trim())) || groups.find(g => CTRL_PART.test(g));
    if (ctrl) set("control", ctrl, `“${ctrl}” reads like a reference group`);

    // 7 · Paired design — needs a real shared subject ID, else assume independent.
    const shared = sharedSubjects();
    if (shared.length >= 2)
      set("paired", "yes", `${shared.slice(0,3).map(s=>`“${s}”`).join(", ")} appear${shared.length>1?"":"s"} in every group`);
    else
      set("paired", "no", "no subject ID is shared between groups", "assumed");
  }

  // A new scan invalidates every guess, including ones the user had already cleared.
  function resetInference(){
    for (const k of Object.keys(S.inferred)) if (!S.touched.has(k)) S.q[k] = "";
    S.inferred = {}; S.autoCleared = false;
  }

  function clearInferred(){
    for (const k of Object.keys(S.inferred)){
      if (S.touched.has(k)) continue;
      S.q[k] = "";
      if (k === "genome") S.q.genomeOther = "";
      delete S.inferred[k];
    }
    S.autoCleared = true;
    render();
  }

  /* =================== render: step G =================== */
  function stepDesign(p){
    if (!S.autoCleared) inferFromScan();

    p.append(head("Step G · Design & analysis", "A few questions about the experiment",
      "These determine how we quantify your reads and what we compare. Pick “Not sure” whenever you are — we will confirm before running anything."));

    const auto = Object.keys(S.inferred).filter(k => !S.touched.has(k));
    if (auto.length){
      const nDet = auto.filter(k => S.inferred[k].kind === "detected").length;
      const bar = el("div","autobar");
      bar.innerHTML = `<span class="base b-G" style="width:22px;height:22px;font-size:11px">?</span>
        <span style="flex:1"><b>${auto.length} answer${auto.length>1?"s":""} pre-filled</b> from your file names
        — ${nDet} detected, ${auto.length-nDet} assumed. Please check each one; every answer is editable.</span>`;
      const clr = el("button","chip","Clear pre-filled");
      clr.onclick = clearInferred;
      bar.append(clr);
      p.append(bar);
    }

    p.append(mcq("organism", "1 · Which organism?", "Sets the reference genome and annotation.", [
      ["human","Human","Homo sapiens"],
      ["mouse","Mouse","Mus musculus"],
      ["rat","Rat","Rattus norvegicus"],
      ["other","Something else","Tell us below"],
    ], true));
    if (S.q.organism === "other") p.append(fillIn("organismOther","Species name","e.g. Danio rerio", true));

    p.append(mcq("library", "2 · How was the library prepared?", "Determines which RNA we expect to see.", [
      ["polya","Poly-A selected mRNA","The default for most kits (TruSeq, NEBNext Ultra II)","common"],
      ["total","Total RNA / rRNA-depleted","Ribo-Zero, RiboMinus — keeps non-coding RNA"],
      ["threeprime","3′-end counting","QuantSeq, BRB-seq — one tag per transcript"],
      ["unsure","Not sure","We will infer it from the data"],
    ], true));

    p.append(mcq("strand", "3 · Was the library stranded?", "Getting this wrong can halve your counts, so we verify it against the data too.", [
      ["reverse","Stranded, reverse","dUTP protocols — the usual answer","common"],
      ["forward","Stranded, forward","Ligation protocols"],
      ["unstranded","Unstranded","Older kits"],
      ["unsure","Not sure","We detect it automatically","recommended"],
    ], true));

    const lay = detectedLayout();
    p.append(mcq("layout", "4 · Read layout",
      lay === "mixed" ? "Your files are mixed — some samples have R1 and R2, others only one. Tell us which is right." : "", [
      ["paired","Paired-end","Two files per sample (R1 and R2)"],
      ["single","Single-end","One file per sample"],
    ], true));

    p.append(mcq("genome", "5 · Reference genome", "", [
      ["latest","Latest standard build","GRCh38 / GRCm39 with GENCODE annotation","recommended"],
      ["specific","A specific build","Match an existing project"],
      ["unsure","Not sure","We use the latest standard build"],
    ], true));
    if (S.q.genome === "specific") p.append(fillIn("genomeOther","Which build & annotation?","e.g. GRCh38 + GENCODE v44", true));

    /* control group */
    const cs = el("div","sec");
    cs.append(secH("6 · Which group is the control?", "Everything is compared against this reference — fold-changes are read as “other group vs control”.", true));
    if (!usedGroups().length){
      const w = el("div","warnbox"); w.innerHTML = "Assign samples to groups on the previous step first.";
      cs.append(w);
    } else {
      const inf = autoInfo("control");
      if (inf) cs.append(whyLine(inf));
      const grid = el("div","mcq two");
      usedGroups().forEach(gr => {
        const n = S.samples.filter(x=>x.condition===gr).length;
        const lb = el("label","opt");
        lb.innerHTML = `<input type="radio" name="control" value="${esc(gr)}" ${S.q.control===gr?"checked":""}>
          <span><span class="ot">${esc(gr)}${autoTag(inf && inf.value===gr, inf)}</span>
          <span class="od">${n} sample${n>1?"s":""} · everything else is compared to this</span></span>`;
        lb.querySelector("input").onchange = () => { S.q.control = gr; S.touched.add("control"); render(); };
        grid.append(lb);
      });
      cs.append(grid);
    }
    p.append(cs);

    p.append(mcq("paired", "7 · Are the groups from the same individuals?", "This decides whether we can pair samples up statistically — it matters a lot with few replicates.", [
      ["no","No — different individuals","Separate mice, donors, or cell-line batches per group","common"],
      ["yes","Yes — same individual in both groups","e.g. before/after treatment in the same patient"],
    ], true));

    /* deliverables */
    const ds = el("div","sec");
    ds.append(secH("8 · What should we deliver?", "Pick everything you want back."));
    const dg = el("div","mcq two");
    [["deg","Differential expression table","Log2 fold-change, p-value, adjusted p-value per gene"],
     ["enrich","Pathway enrichment","GO, KEGG, Hallmark over-representation"],
     ["bundle","Interactive Studio bundle","Explore results yourself in RNA-seq Studio"],
     ["qc","QC report","Per-sample read quality, alignment rate, PCA"],
     ["counts","Raw + normalised counts","Gene-level count matrices (CSV)"],
     ["bam","Alignment files (BAM)","Large — only if you need them"]].forEach(([v,t,d]) => {
      const lb = el("label","opt");
      lb.innerHTML = `<input type="checkbox" ${S.q.deliver.has(v)?"checked":""}>
        <span><span class="ot">${t}</span><span class="od">${d}</span></span>`;
      lb.querySelector("input").onchange = e => {
        e.target.checked ? S.q.deliver.add(v) : S.q.deliver.delete(v); validate();
      };
      dg.append(lb);
    });
    ds.append(dg);
    p.append(ds);

    /* free text */
    const qs = el("div","sec");
    qs.append(secH("9 · What is the biological question?", "One or two sentences. This is the single most useful thing you can tell us."));
    const ta = el("textarea");
    ta.placeholder = "e.g. Does knocking out NR4A2 in microglia change the inflammatory response? We expect NF-κB targets to go up.";
    ta.value = S.q.question;
    ta.oninput = () => { S.q.question = ta.value; };
    qs.append(ta);
    p.append(qs);
  }

  /* =================== render: step T =================== */
  function stepRequest(p){
    p.append(head("Step T · Review & send", "Your service request",
      "Check the summary, add your contact details, then download the request. Send it to us with your data and we will confirm scope and turnaround before anything runs."));

    const cs = el("div","sec");
    cs.append(secH("Contact", "So we can reply and quote."));
    const g = el("div","grid2");
    g.append(
      field("name","Your name","Jane Doe",true),
      field("email","Email","jane@university.edu",true,"email"),
      field("org","Institution / company","Your institute"),
      field("project","Project title","NR4A2 knockout in microglia"),
    );
    cs.append(g);
    p.append(cs);

    p.append(mcq("turnaround","Turnaround","", [
      ["standard","Standard","10 working days","common"],
      ["priority","Priority","4 working days"],
      ["flexible","No rush","Whenever you have capacity"],
    ], true, "c"));

    const ns = el("div","sec");
    ns.append(secH("Anything else we should know?", "Batches, failed samples, known contamination, a prior analysis to match."));
    const ta = el("textarea"); ta.value = S.c.notes; ta.placeholder = "Optional";
    ta.oninput = () => { S.c.notes = ta.value; };
    ns.append(ta);
    p.append(ns);

    const rs = el("div","sec");
    rs.append(secH("Request summary", ""));
    const spec = el("div","spec");
    const lay = S.q.layout || detectedLayout();
    const rows = [
      ["files", `${S.files.length} FASTQ · ${fmtSize(totalBytes())}`],
      ["samples", `${S.samples.length} · ${lay==="paired"?"paired-end":"single-end"}`],
      ["groups", usedGroups().map(gr => `${gr} (n=${S.samples.filter(x=>x.condition===gr).length})`).join("  ·  ") || "—"],
      ["control", S.q.control || "—"],
      ["comparisons", usedGroups().filter(gr=>gr!==S.q.control).map(gr=>`${gr} vs ${S.q.control}`).join("  ·  ") || "—"],
      ["organism", S.q.organism==="other" ? (S.q.organismOther||"other") : (label("organism",S.q.organism)||"—")],
      ["library", label("library",S.q.library)||"—"],
      ["strandedness", label("strand",S.q.strand)||"—"],
      ["genome", S.q.genome==="specific" ? (S.q.genomeOther||"specific") : (label("genome",S.q.genome)||"—")],
      ["design", S.q.paired==="yes" ? "Paired / repeated measures" : "Independent samples"],
      ["deliverables", [...S.q.deliver].map(d=>DELIV[d]).join("  ·  ") || "—"],
      ["question", S.q.question || "—"],
    ];
    spec.innerHTML = rows.map(([k,v]) =>
      `<div class="spec-r"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("");
    rs.append(spec);
    p.append(rs);

    const ag = el("label","opt"); ag.style.marginTop="16px";
    ag.innerHTML = `<input type="checkbox" ${S.c.agree?"checked":""}>
      <span><span class="ot">I confirm these samples are correctly named</span>
      <span class="od">Sample names and group assignments carry through to every figure and table we return.</span></span>`;
    ag.querySelector("input").onchange = e => { S.c.agree = e.target.checked; validate(); };
    p.append(ag);

    const acts = el("div","rowacts"); acts.style.marginTop="18px";
    const dl = el("button","btn","Download request (.json)");
    dl.onclick = () => download(`rnaseq-request-${reqId()}.json`, JSON.stringify(buildRequest(),null,2), "application/json");
    const cm = el("button","btn btn-2","Download sample sheet (.csv)");
    cm.onclick = () => download(`samplesheet-${reqId()}.csv`, buildCsv(), "text/csv");
    const cp = el("button","btn btn-2","Copy summary");
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(JSON.stringify(buildRequest(),null,2)); cp.textContent="Copied"; }
      catch { cp.textContent="Press Ctrl+C"; }
      setTimeout(()=>cp.textContent="Copy summary",1600);
    };
    acts.append(dl, cm, cp);
    p.append(acts);

    const n = el("div","note");
    n.innerHTML = `<b>What happens next.</b> Send the request file with your data — we confirm scope,
      quote, and turnaround before anything runs. You get the deliverables above, and if you asked for a
      Studio bundle you can explore every gene yourself in the browser.`;
    p.append(n);
  }

  const DELIV = {deg:"DE table", enrich:"Pathway enrichment", bundle:"Studio bundle",
                 qc:"QC report", counts:"Count matrices", bam:"BAM files"};
  const LABELS = {
    organism:{human:"Human (Homo sapiens)",mouse:"Mouse (Mus musculus)",rat:"Rat (Rattus norvegicus)",other:"Other"},
    library:{polya:"Poly-A selected mRNA",total:"Total RNA / rRNA-depleted",threeprime:"3′-end counting",unsure:"Not sure — infer from data"},
    strand:{reverse:"Stranded, reverse",forward:"Stranded, forward",unstranded:"Unstranded",unsure:"Not sure — detect automatically"},
    genome:{latest:"Latest standard build",specific:"Specific build",unsure:"Not sure — use latest"},
    turnaround:{standard:"Standard (10 working days)",priority:"Priority (4 working days)",flexible:"Flexible"},
  };
  const label = (k,v) => LABELS[k]?.[v] || "";

  let RID = null;
  const reqId = () => RID ||= "R" + Date.now().toString(36).toUpperCase().slice(-6);

  function buildRequest(){
    return {
      request_id: reqId(),
      created: new Date().toISOString(),
      contact: {name:S.c.name, email:S.c.email, institution:S.c.org, project:S.c.project,
                turnaround:S.c.turnaround, notes:S.c.notes},
      data: {
        n_fastq:S.files.length, total_bytes:totalBytes(),
        layout: S.q.layout || detectedLayout(),
        samples: S.samples.map(s => ({
          sample:s.name, condition:s.condition,
          files:s.files.map(f => ({file:f.name, path:f.path, read:f.read, bytes:f.size})),
        })),
      },
      design: {
        groups: usedGroups(), control: S.q.control,
        contrasts: usedGroups().filter(g=>g!==S.q.control).map(g=>({numerator:g, denominator:S.q.control})),
        paired_design: S.q.paired === "yes",
      },
      protocol: {
        organism: S.q.organism==="other" ? S.q.organismOther : S.q.organism,
        library: S.q.library, strandedness: S.q.strand,
        genome: S.q.genome==="specific" ? S.q.genomeOther : S.q.genome,
      },
      deliverables: [...S.q.deliver],
      question: S.q.question,
    };
  }
  function buildCsv(){
    const pe = (S.q.layout || detectedLayout()) === "paired";
    const head = pe ? "sample,condition,fastq_1,fastq_2" : "sample,condition,fastq_1";
    const rows = S.samples.map(s => {
      const r1 = s.files.find(f=>f.read===1) || s.files[0];
      const r2 = s.files.find(f=>f.read===2);
      const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
      return pe ? [s.name,s.condition,r1?.path||"",r2?.path||""].map(q).join(",")
                : [s.name,s.condition,r1?.path||""].map(q).join(",");
    });
    return [head, ...rows].join("\n") + "\n";
  }
  function download(name, text, type){
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = el("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  /* =================== shared UI builders =================== */
  function head(eyebrow, title, lede){
    const d = el("div");
    d.append(el("div","eyebrow",eyebrow), el("h2","h-step",title), el("p","lede",lede));
    return d;
  }
  function stat(k,v,sub){
    return `<div class="stat"><div class="k">${k}</div><div class="v">${v}${sub?` <small>${sub}</small>`:""}</div></div>`;
  }
  function secH(t, sub, required){
    const f = document.createDocumentFragment();
    const h = el("div","sec-h"); h.append(document.createTextNode(t));
    if (required) h.append(el("span","req","required"));
    f.append(h);
    if (sub) f.append(el("p","sec-sub",sub));
    return f;
  }
  function mcq(key, title, sub, opts, required, store){
    const s = el("div","sec");
    s.append(secH(title, sub, required));
    const inf = store === "c" ? null : autoInfo(key);
    if (inf) s.append(whyLine(inf));
    const g = el("div","mcq two");
    const bag = store === "c" ? S.c : S.q;
    opts.forEach(([v,t,d,tag]) => {
      const auto = inf && inf.value === v;
      const lb = el("label","opt");
      lb.innerHTML = `<input type="radio" name="${key}" value="${v}" ${bag[key]===v?"checked":""}>
        <span><span class="ot">${t}${autoTag(auto,inf)}${
          tag?`<span class="tag ${tag==="recommended"?"rec":""}">${tag}</span>`:""}</span>
        ${d?`<span class="od">${d}</span>`:""}</span>`;
      lb.querySelector("input").onchange = () => { bag[key]=v; if (store!=="c") S.touched.add(key); render(); };
      g.append(lb);
    });
    s.append(g);
    return s;
  }
  // An auto-filled answer only counts while the user has not overridden it.
  const autoInfo = key => (!S.touched.has(key) && S.inferred[key]) ? S.inferred[key] : null;
  const autoTag = (on, inf) => on
    ? `<span class="tag ${inf.kind==="detected"?"det":"asm"}">${inf.kind==="detected"?"from your files":"assumed"}</span>` : "";
  function whyLine(inf){
    const d = el("p","why");
    d.innerHTML = `<span>${inf.kind==="detected"?"Detected":"Assumed"}</span> ${esc(inf.why)}`;
    return d;
  }
  function fillIn(key, lbl, ph, required){
    const s = el("div","sec"); s.style.marginTop="12px";
    const f = el("div","field");
    const l = el("label"); l.textContent = lbl;
    if (required) l.append(el("span","req"," required"));
    const i = el("input"); i.type="text"; i.placeholder=ph; i.value=S.q[key]||"";
    i.style.maxWidth="380px";
    i.oninput = () => { S.q[key]=i.value; validate(); };
    f.append(l,i); s.append(f);
    return s;
  }
  function field(key, lbl, ph, required, type){
    const f = el("div","field");
    const l = el("label"); l.textContent = lbl;
    if (required) l.append(el("span","req"," required"));
    const i = el("input"); i.type = type||"text"; i.placeholder=ph; i.value=S.c[key]||"";
    i.oninput = () => { S.c[key]=i.value; validate(); };
    f.append(l,i);
    return f;
  }

  /* =================== gating =================== */
  function blocker(){
    if (S.step===0){
      if (!S.files.length) return "Add your sequencing folder to continue.";
    }
    if (S.step===1){
      if (S.samples.some(x => !x.name.trim())) return "Every sample needs a name.";
      const names = S.samples.map(x=>x.name.trim());
      if (new Set(names).size !== names.length) return "Sample names must be unique.";
      if (S.samples.some(x => !x.condition)) return "Assign every sample to a group.";
      if (usedGroups().length < 2) return "You need at least two groups to compare.";
    }
    if (S.step===2){
      if (!S.q.organism) return "Pick an organism (question 1).";
      if (S.q.organism==="other" && !S.q.organismOther.trim()) return "Name the species (question 1).";
      if (!S.q.library) return "Pick a library prep (question 2).";
      if (!S.q.strand) return "Pick a strandedness (question 3).";
      if (!S.q.layout) return "Confirm the read layout (question 4).";
      if (!S.q.genome) return "Pick a reference genome (question 5).";
      if (S.q.genome==="specific" && !S.q.genomeOther.trim()) return "Name the genome build (question 5).";
      if (!S.q.control) return "Choose the control group (question 6).";
      if (!S.q.paired) return "Answer the paired-design question (question 7).";
      if (!S.q.deliver.size) return "Pick at least one deliverable (question 8).";
    }
    if (S.step===3){
      if (!S.c.name.trim()) return "Add your name.";
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.c.email)) return "Add a valid email address.";
      if (!S.c.turnaround) return "Choose a turnaround.";
      if (!S.c.agree) return "Confirm the sample names are correct.";
    }
    return null;
  }

  function validate(){
    const b = blocker();
    const next = $("#nextBtn"), m = $("#msg");
    const last = S.step === STEPS.length-1;
    next.disabled = !!b;
    next.textContent = last ? "Request ready ✓" : "Continue →";
    if (last && !b) next.disabled = true;
    m.textContent = b || (last ? "Everything checks out — download your request below." : "");
    m.className = "msg" + (b ? " block" : "");
    $("#backBtn").disabled = S.step === 0;
    drawRail();
  }
  function msg(t){ const m=$("#msg"); if(m){ m.textContent=t; m.className="msg"; } }

  /* =================== chrome =================== */
  function drawRail(){
    const rail = $("#rail");
    rail.innerHTML = '<div class="rail-h">Request · 4 steps</div>';
    STEPS.forEach((st, i) => {
      const saved = S.step; S.step = i;
      const ok = !blocker();
      S.step = saved;
      const b = el("button", `stepbtn${i===S.step?" on":""}${ok&&i<S.step?" done":""}`);
      b.type = "button";
      b.disabled = i > S.step;
      b.innerHTML = `<span class="base b-${st.base}">${st.base}</span>
        <span><span class="lb">${st.label}</span><span class="sb">${ok&&i<S.step?"done":st.sub}</span></span>`;
      b.onclick = () => { if (i<=S.step){ S.step=i; render(); } };
      rail.append(b);
    });
    const p = $("#prog");
    p.innerHTML = STEPS.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("");
  }

  function render(){
    const p = $("#panel");
    p.innerHTML = "";
    [stepFiles, stepSamples, stepDesign, stepRequest][S.step](p);
    drawRail();
    validate();
    window.scrollTo({top:0, behavior:"instant"});
  }

  $("#backBtn").onclick = () => { if (S.step>0){ S.step--; render(); } };
  $("#nextBtn").onclick = () => { if (!blocker() && S.step<STEPS.length-1){ S.step++; render(); } };
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", cur==="dark" ? "light" : "dark");
  };

  /* =================== demo data =================== */
  function loadDemo(){
    const root = "250312_NovaSeq_Mouse_Brain_mRNAseq";
    const names = ["WT_1","WT_2","WT_3","KO_1","KO_2","KO_3"];
    const list = [];
    names.forEach((n,i) => [1,2].forEach(r => list.push({
      name:`${n}_S${i+1}_L001_R${r}_001.fastq.gz`,
      path:`${root}/${n}/${n}_S${i+1}_L001_R${r}_001.fastq.gz`,
      size: 2.1e9 + i*7e7 + r*3e6,
    })));
    list.push({name:"md5sum.txt", path:`${root}/md5sum.txt`, size:2048});
    list.push({name:"RunInfo.xml", path:`${root}/RunInfo.xml`, size:8192});
    resetInference();
    S.files = []; ingest(list);
    S.samples.forEach(s => s.condition = s.name.startsWith("WT") ? "Control" : "Treated");
    render();
  }

  render();
})();
</script>
